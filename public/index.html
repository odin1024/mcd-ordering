<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="麦门点单 —— 基于麦当劳官方 MCP 的全流程点餐体验：附近门店、真实菜单、选配计价、一键下单。">
<title>麦门点单 · 麦当劳 MCP 全流程点餐</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app" id="app">

  <!-- ========== 顶部品牌区 ========== -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">M</div>
      <div class="brand-text">
        <h1>麦门点单</h1>
        <span class="brand-sub">MCD&nbsp;ORDERING&nbsp;·&nbsp;官方 MCP 全流程点餐</span>
      </div>
    </div>
  </header>

  <!-- ========== 模式状态条（独立一行，避免挤压标题） ========== -->
  <div class="status-strip" id="modeStrip">
    <span class="dot"></span><span id="modeText">连接中…</span>
  </div>

  <!-- ========== 步骤条 ========== -->
  <nav class="steps" id="steps">
    <div class="step active" data-step="1"><i>1</i><span>选门店</span></div>
    <div class="step" data-step="2"><i>2</i><span>点餐</span></div>
    <div class="step" data-step="3"><i>3</i><span>结算下单</span></div>
  </nav>

  <!-- ========== 主内容 ========== -->
  <main class="main">

    <!-- 步骤1：门店选择 -->
    <section class="panel" id="panelStores">
      <div class="panel-head">
        <h2>选择门店 <span class="hint">真实数据 · 到店自取</span></h2>
        <button class="ghost-btn" id="btnRefreshStores">刷新</button>
      </div>
      <div class="store-note" id="storeNote"></div>
      <div class="store-grid" id="storeGrid">
        <div class="loading card-loading">正在获取附近门店…</div>
      </div>
    </section>

    <!-- 步骤2：菜单 -->
    <section class="panel hidden" id="panelMenu">
      <div class="menu-layout">
        <aside class="cat-list" id="catList"></aside>
        <div class="menu-body">
          <div class="panel-head">
            <h2 id="menuStoreName">门店菜单</h2>
            <button class="ghost-btn" id="btnChangeStore">换门店</button>
          </div>
          <div class="meal-grid" id="mealGrid">
            <div class="loading card-loading">正在加载真实菜单…</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 步骤3：结算 -->
    <section class="panel hidden" id="panelCheckout">
      <div class="checkout-wrap">
        <div class="checkout-card">
          <div class="panel-head"><h2>确认订单</h2><button class="ghost-btn" id="btnBackMenu">← 继续点餐</button></div>
          <div class="takeway-row" id="takeWayRow"></div>
          <div class="order-items" id="orderItems"></div>
          <div class="order-sum">
            <div class="sum-line"><span>商品小计</span><b id="sumSubtotal">¥0.00</b></div>
            <div class="sum-line"><span>优惠</span><b class="green" id="sumDiscount">-¥0.00</b></div>
            <div class="sum-line total"><span>应付合计</span><b id="sumTotal">¥0.00</b></div>
          </div>
          <button class="primary-btn big" id="btnPlaceOrder">提交订单</button>
          <p class="order-tip" id="orderTip">演示模式：将生成模拟订单，不会真实扣款</p>
        </div>
      </div>
    </section>

    <!-- 步骤4：订单结果 -->
    <section class="panel hidden" id="panelResult">
      <div class="result-card">
        <div class="result-icon" id="resultIcon">✅</div>
        <h2 id="resultTitle">订单已提交</h2>
        <p class="result-sub" id="resultSub">麦门欢迎你，干饭人</p>
        <div class="result-box">
          <div class="r-line"><span>订单号</span><b id="rOrderId">-</b></div>
          <div class="r-line"><span>门店</span><b id="rStore">-</b></div>
          <div class="r-line"><span>取餐方式</span><b id="rTakeWay">-</b></div>
          <div class="r-line"><span>实付金额</span><b class="gold" id="rAmount">-</b></div>
          <div class="r-line"><span>下单时间</span><b id="rTime">-</b></div>
        </div>
        <div class="result-actions">
          <button class="ghost-btn" id="btnOrderList">查看历史订单</button>
          <button class="primary-btn" id="btnAgain">再来一单</button>
        </div>
      </div>
    </section>

    <!-- 历史订单抽屉 -->
    <div class="drawer-mask hidden" id="orderDrawerMask"></div>
    <aside class="drawer hidden" id="orderDrawer">
      <div class="drawer-head"><h3>历史订单</h3><button class="ghost-btn" id="btnCloseDrawer">关闭</button></div>
      <div class="drawer-body" id="orderListBox">
        <div class="loading">加载中…</div>
      </div>
    </aside>

  </main>

  <!-- ========== 餐品详情弹层 ========== -->
  <div class="modal-mask hidden" id="mealModalMask"></div>
  <div class="modal hidden" id="mealModal">
    <div class="modal-head">
      <button class="icon-btn" id="btnCloseModal">✕</button>
    </div>
    <div class="modal-body" id="mealModalBody">
      <div class="loading">加载餐品详情…</div>
    </div>
  </div>

  <!-- ========== 购物车栏（移动端） / 侧栏（桌面） ========== -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-left" id="cartInfo">
      <div class="cart-badge" id="cartBadge">0</div>
      <div class="cart-text">
        <b id="cartTotalText">¥0.00</b>
        <span id="cartCountText">购物车是空的</span>
      </div>
    </div>
    <button class="primary-btn" id="btnCartGo" disabled>去结算</button>
  </div>

  <footer class="foot">
    <span>基于麦当劳官方 MCP · 零依赖 · 开源</span>
    <span id="footMode"></span>
  </footer>
</div>

<script src="./app.js"></script>
</body>
</html>
